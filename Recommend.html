
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Discover Movies and Book Tickets">
    <meta name="keywords" content="movies, tickets, recommendations">
    <meta name="author" content="Nishith">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lumi Reels - Discover Movies and Book Tickets</title>

    <link rel="stylesheet" href="style/desktop.css" media="screen and (min-width: 768px)">
    <link rel="stylesheet" href="style/mobile.css" media="screen and (max-width: 767px)">
    <script src="js/script.js"></script>
</head>

<body>

    <header id="main-header">
        <h1>Find Your Next Movie Night</h1>

        <nav aria-label="Main navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="movies.html">Movies</a></li>
                <li><a href="recommend.html">Recommendations</a></li>
                <li><a href="register.html">Register</a></li>
                <li><a href="booking.html">Book Tickets</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Find the perfect Movie</h2>

            <form id="recommendation-form">

                <fieldset>
                    <legend>Your Movie Preference</legend>

                    <p>
                        <label for="preferredgenre">Preferred Genre:</label>

                        <select id="preferredgenre" name="preferredgenre" required>
                            <option value="">Select a Genre</option>
                            <option value="romance">Romance</option>
                            <option value="sciencefiction">Science Fiction</option>
                            <option value="animation">Animation</option>
                            <option value="crime">Crime</option>
                            <option value="mystery">Mystery</option>
                            <option value="action">Action</option>
                            <option value="thriller">Thriller</option>
                        </select>
                    </p>

                    <p>
                        <label for="agegroup">Age Group</label>

                        <select id="agegroup" name="agegroup" required>
                            <option value="">Select age group</option>
                            <option value="child">Child</option>
                            <option value="teen">Teen</option>
                            <option value="adult">Adult</option>
                        </select>
                    </p>

                    <p>
                        <label for="viewingpref">Viewing Preferences</label>

                        <select id="viewingpref" name="viewingpref" required>
                            <option value="">Select viewing preference</option>
                            <option value="family">Family</option>
                            <option value="friends">Friends</option>
                            <option value="datenight">Date Night</option>
                            <option value="solo">Solo</option>
                        </select>
                    </p>
                </fieldset>

                <p>
                    <button type="submit" id="find-movie">
                        Find My Movie
                    </button>
                </p>

            </form>
        </section>

        <section id="recommendation-result" hidden>

            <h2>Your Recommended Movie</h2>

            <h3 id="recommended-title">..</h3>

            <p>Genre: <span id="recommended-genre"></span></p>

            <p>Age Rating: <span id="recommended-rating"></span></p>

            <a href="#" id="recommended-booking"
            class="recommend-book-btn">
                Book Tickets
            </a>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Lumi Reels. All rights reserved.</p>
    </footer>

</body>
</html>
